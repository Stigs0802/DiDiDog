<!doctype html><html lang="zh-Hant-TW"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIDI 網站管理</title><style>body{margin:0;background:#fff7ea;color:#6b4226;font-family:Arial,sans-serif}main{max-width:820px;margin:30px auto;padding:0 18px}h1{margin:0 0 6px}.card{background:#fff;border-radius:24px;padding:22px;margin-top:18px;box-shadow:0 12px 28px #6b422622}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:grid;gap:6px;color:#8b5e34;font-weight:bold;font-size:14px}.wide{grid-column:1/-1}input,textarea{border:1px solid #fde1a0;border-radius:12px;padding:11px;font:inherit}textarea{min-height:80px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.photo{border:1px dashed #f5b88e;border-radius:14px;padding:11px}.photo strong{font-size:14px}.photo input{width:100%;margin-top:8px;font-size:12px}.save{width:100%;border:0;border-radius:14px;background:#f5b88e;padding:14px;font-size:17px;font-weight:bold;color:#6b4226}.status{text-align:center;color:#4f7a3d;font-weight:bold;min-height:20px}@media(max-width:600px){.grid,.photos{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><p style="color:#f5b88e;font-weight:bold">DIDI'S WORLD</p><h1>網站管理</h1><p>修改文字或選擇新照片，按儲存即可。</p><form id="manager"><section class="card"><h2>管理密碼</h2><label>請輸入密碼<input name="pin" type="password" required></label></section><section class="card"><h2>網站文字</h2><div class="grid"><label>網站主標題<input name="siteTitle"></label><label>首頁大標題<input name="heroTitle"></label><label class="wide">首頁介紹<textarea name="heroIntro"></textarea></label><label>介紹區標題<input name="aboutTitle"></label><label class="wide">介紹內容<textarea name="aboutText"></textarea></label><label>聯絡區標題<input name="contactTitle"></label><label>Email<input name="email" type="email"></label><label class="wide">聯絡區內容<textarea name="contactText"></textarea></label><label>WhatsApp 電話<input name="whatsapp"></label></div></section><section class="card"><h2>網站照片</h2><div class="photos"><div class="photo"><strong>首頁主照片</strong><input type="file" data-image="heroImage" accept="image/*"></div><div class="photo"><strong>介紹區照片</strong><input type="file" data-image="aboutImage" accept="image/*"></div><div class="photo"><strong>相簿照片 1</strong><input type="file" data-image="galleryImage1" accept="image/*"></div><div class="photo"><strong>相簿照片 2</strong><input type="file" data-image="galleryImage2" accept="image/*"></div><div class="photo"><strong>相簿照片 3</strong><input type="file" data-image="galleryImage3" accept="image/*"></div></div><p>新照片會自動上傳並設為網站訪客可瀏覽。</p></section><section class="card"><button class="save" id="save" type="submit">儲存並更新網站</button><p class="status" id="status"></p></section></form></main><script>const form=document.querySelector('#manager'),save=document.querySelector('#save'),status=document.querySelector('#status');let content={};function readFile(file){return new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(ok).withFailureHandler(bad).uploadSiteImage({name:file.name,mimeType:file.type,base64:r.result.split(',')[1]},form.pin.value);r.readAsDataURL(file)})}form.pin.addEventListener('change',()=>google.script.run.withSuccessHandler(data=>{content=data;Object.keys(data).forEach(k=>{if(form.elements[k])form.elements[k].value=data[k]||''});status.textContent='資料已載入';}).withFailureHandler(e=>status.textContent=e.message).getSiteContent(form.pin.value));form.addEventListener('submit',async e=>{e.preventDefault();save.disabled=true;status.textContent='正在更新...';try{let data={...content};new FormData(form).forEach((v,k)=>{if(k!=='pin')data[k]=v});for(const input of document.querySelectorAll('[data-image]'))if(input.files[0])data[input.dataset.image]=await readFile(input.files[0]);google.script.run.withSuccessHandler(()=>{save.disabled=false;status.textContent='已更新網站';}).withFailureHandler(err=>{save.disabled=false;status.textContent=err.message;}).saveSiteContent(data,form.pin.value)}catch(err){save.disabled=false;status.textContent=err.message}})</script></body></html>
